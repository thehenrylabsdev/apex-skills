apex:
  environment: "DEV"
  use-embedded-infra: false

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/apexledger}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:apex}
    password: ${DATABASE_PASSWORD:apex_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.thehenrylabs.apexledger: DEBUG
